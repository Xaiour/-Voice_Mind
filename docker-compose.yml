version: "3.9"

services:
  # ─── Next.js Frontend ───────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
    networks:
      - voicemind-network

  # ─── Express.js API ─────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - VOICE_SERVICE_URL=http://voice:8001
    depends_on:
      - redis
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - uploads:/app/uploads
    networks:
      - voicemind-network

  # ─── Python Voice Analysis ──────────────────────────
  voice:
    build:
      context: ./services/voice-analysis
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_PATH=/app/models
    volumes:
      - ./services/voice-analysis:/app
      - voice-models:/app/models
    networks:
      - voicemind-network

  # ─── Redis (local dev) ──────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - voicemind-network

  # ─── MongoDB (local dev) ────────────────────────────
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongo-data:/data/db
    networks:
      - voicemind-network

volumes:
  uploads:
  redis-data:
  mongo-data:
  voice-models:

networks:
  voicemind-network:
    driver: bridge
